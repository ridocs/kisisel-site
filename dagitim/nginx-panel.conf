# Müşteri paneli: nginx blok ÖRNEĞİ.
#
# Sitenin mevcut sunucu bloğunun İÇİNE eklenir. Yer tutucular (<...>) gerçek
# değerlerle değiştirilir. Depo herkese açık: gerçek yol ve adres yazılmaz.
#
# Kurulum adımları: dagitim/KURULUM.md

# ---------------------------------------------------------------------------
# SIRA ÖNEMLİ DEĞİL, UZUNLUK ÖNEMLİ.
#
# nginx önek konumlarında en UZUN eşleşmeyi seçer, dosyadaki sırayı değil.
# `/web-sitem/panel/` (18 karakter) `/web-sitem/` (11 karakter) konumundan
# uzun olduğu için panel istekleri statik dosyalara düşmez. Yine de iki bloğu
# yan yana tutun: birini taşıyıp ötekini unutmak kolay.
# ---------------------------------------------------------------------------

location /web-sitem/panel/ {
	# Sondaki eğik çizgi YOK. Olsaydı nginx yolu yeniden yazardı ve panel
	# kendi `base` değerini (/web-sitem/panel) göremezdi: bütün bağlantılar
	# ve çerez `Path` değeri kayardı.
	proxy_pass http://127.0.0.1:4327;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;

	# Oran sınırlama ve oturum bağlama gerçek IP'ye bakıyor. Bu başlık
	# olmadan bütün istekler 127.0.0.1'den geliyormuş gibi görünür ve
	# IP sayacı anlamsızlaşır.
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	# Panel kendi güvenlik başlıklarını üretiyor (CSP, HSTS, nosniff).
	# Dışarıdaki bir `add_header` bunları EZER, çünkü nginx'te add_header
	# alt bloklarda miras alınmaz ve çakışan başlık iki kez gider.
	proxy_pass_header Content-Security-Policy;

	proxy_connect_timeout 5s;
	proxy_read_timeout 30s;

	# WebAuthn akışı küçük JSON gönderiyor; büyük gövdeye ihtiyaç yok.
	client_max_body_size 256k;
}

# Statik site, bugünkü hâliyle. Panel bloğu bunun yanında duruyor.
location /web-sitem/ {
	alias <statik-kok>/web-sitem/;
	index index.html;
	try_files $uri $uri/ $uri/index.html =404;

	location ~* ^/web-sitem/_astro/ {
		# İçerik adresli dosyalar; adı değişmeden içeriği değişmiyor.
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
}
