<!--
  Site simgesi — "M" monogramı.

  Neden iki harf değil tek harf: simge sekmede 16 piksele iniyor. "ME" o
  ölçekte iki harf değil, tek bir lekeye dönüşüyor. İletişim kartındaki "ME"
  rozeti 48 pikselde duruyor, orada iki harf okunuyor; burada okunmuyor.

  Harf metin değil YOL olarak çizili: simgeyi çizen tarayıcının yazı tipi
  yüklemesini bekleyemeyiz, metin olsaydı yazı tipi gelene kadar boş ya da
  yedek bir harfle görünürdü.

  Zemin dolu: saydam zeminli simgeler koyu sekmede kayboluyor. Marka mavisi
  her iki tarayıcı temasında da beyaz harfle yeterli kontrast veriyor, bu
  yüzden ayrıca koyu tema varyantı yok.

  Renk `global.css` içindeki `color-marka-500` ile aynı: oklch(0.62 0.18 250).
  SVG bağımsız yükleniyor ve CSS değişkenlerini göremiyor, o yüzden değer
  burada sabit — ikisi birlikte değişmeli.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mustafa Eybek">
	<rect width="64" height="64" rx="14" fill="#2f6fe4" />
	<path
		d="M17 45V21.5c0-1 1.2-1.5 1.9-.8L32 34l13.1-13.3c.7-.7 1.9-.2 1.9.8V45"
		fill="none"
		stroke="#fff"
		stroke-width="7"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
</svg>
