<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<!--
			Bu sayfa hiçbir dış kaynak yüklemiyor ve yükleyememeli. Politika
			`file:` üzerinden veriliyor: bir `file://` belgesinde 'self'
			kaynağı boş sayılır ve kendi dosyalarımızı bile engeller.
			`img-src` içindeki `data:` QR kodu için; QR ana süreçte üretilip
			`data:` adresi olarak geliyor.

			`style-src` içinde 'unsafe-inline' YOK, yani satır içi `style`
			niteliği çalışmıyor. Bu ölçülerek görüldü: ilk sürümde çubuk
			genişlikleri ve boşluklar sessizce uygulanmıyordu. Arayüz artık
			ölçü değerlerini CSSOM üzerinden veriyor (`el(…, { stil: … })`),
			onu politika engellemiyor.

			`frame-ancestors` buradan verilemiyor: bir `<meta>` etiketinde
			yok sayılıyor ve konsola uyarı basıyor. Bu pencere zaten hiçbir
			yere gömülmüyor.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src file:; style-src file:; img-src file: data:; font-src file:; form-action 'none'; base-uri 'none'"
		/>
		<title>Yönetim</title>
		<link rel="stylesheet" href="stil.css" />
	</head>
	<body>
		<div class="kabuk">
			<nav class="yan" aria-label="Ekranlar">
				<p class="marka">Yönetim</p>
				<ul class="gezinti" id="gezinti">
					<li><button type="button" data-ekran="musteriler" aria-current="page">Müşteriler <kbd>1</kbd></button></li>
					<li><button type="button" data-ekran="isler">İşler <kbd>2</kbd></button></li>
					<li><button type="button" data-ekran="odemeler">Ödemeler <kbd>3</kbd></button></li>
					<li><button type="button" data-ekran="revizeler">Revizeler <kbd>4</kbd></button></li>
					<li><button type="button" data-ekran="istatistik">İstatistikler <kbd>5</kbd></button></li>
					<li><button type="button" data-ekran="davetler">Davetler <kbd>6</kbd></button></li>
					<li><button type="button" data-ekran="esitleme">Eşitleme <kbd>7</kbd></button></li>
					<li><button type="button" data-ekran="talepler">Destek talepleri <kbd>8</kbd></button></li>
				</ul>
				<div class="yan-dip">
					<p class="rozet" id="sifreleme-rozeti">Anahtarlık denetleniyor…</p>
					<p class="kucuk">Veriler yalnızca bu bilgisayarda.</p>
				</div>
			</nav>

			<main class="ana">
				<header class="baslik-cubugu">
					<h1 id="ekran-basligi">Müşteriler</h1>
					<div class="araclar" id="ekran-araclari"></div>
				</header>

				<p class="bildirim" id="bildirim" role="status" aria-live="polite" hidden></p>

				<section class="icerik" id="icerik" tabindex="-1" aria-live="polite"></section>
			</main>
		</div>

		<dialog id="form-penceresi" aria-labelledby="form-basligi">
			<form method="dialog" id="form-govdesi" novalidate>
				<h2 id="form-basligi">Kayıt</h2>
				<p class="form-hata" id="form-hata" role="alert" hidden></p>
				<div class="alanlar" id="form-alanlari"></div>
				<footer class="form-dip">
					<button type="button" class="dugme sade" id="form-vazgec">Vazgeç</button>
					<button type="submit" class="dugme birincil" id="form-kaydet">Kaydet</button>
				</footer>
			</form>
		</dialog>

		<script type="module" src="uygulama.js"></script>
	</body>
</html>
