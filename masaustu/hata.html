<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<title>Panel açılamadı</title>
		<!--
			HATA EKRANI

			Sunucu zaman aşımına uğradığında ya da hiç başlamadığında gösteriliyor.
			Boş bir pencere bırakmak en kötüsü: kullanıcı beklemeye devam mı etsin,
			kapatsın mı bilmiyor. Burada ne olduğu ve ne yapılacağı yazıyor.

			Hata metni `location.hash` ile geliyor — bekleme ekranıyla aynı yol.
		-->
		<style>
			:root {
				color-scheme: light dark;
				--zemin: #fafafa;
				--metin: #262626;
				--soluk: #737373;
				--cizgi: #e5e5e5;
				--kutu: #f5f5f5;
				--uyari: #b91c1c;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--zemin: #0a0a0a;
					--metin: #e5e5e5;
					--soluk: #a3a3a3;
					--cizgi: #262626;
					--kutu: #171717;
					--uyari: #f87171;
				}
			}
			html,
			body {
				height: 100%;
			}
			body {
				margin: 0;
				display: grid;
				place-items: center;
				background: var(--zemin);
				color: var(--metin);
				font:
					15px/1.6 system-ui,
					"Segoe UI",
					sans-serif;
			}
			.kutu {
				max-width: 42rem;
				padding: 2rem;
			}
			h1 {
				margin: 0 0 0.75rem;
				font-size: 1.15rem;
				font-weight: 600;
				color: var(--uyari);
				letter-spacing: -0.01em;
			}
			pre {
				margin: 0 0 1.25rem;
				padding: 0.9rem 1rem;
				background: var(--kutu);
				border: 1px solid var(--cizgi);
				border-radius: 6px;
				font:
					13px/1.55 ui-monospace,
					Consolas,
					monospace;
				/* Hata metni uzun olabiliyor; taşıp yatay kaydırma açmasın. */
				white-space: pre-wrap;
				word-break: break-word;
			}
			ol {
				margin: 0;
				padding-left: 1.2rem;
				color: var(--soluk);
				font-size: 0.9rem;
			}
			li {
				margin-bottom: 0.35rem;
			}
			code {
				font:
					12.5px/1.4 ui-monospace,
					Consolas,
					monospace;
				background: var(--kutu);
				border: 1px solid var(--cizgi);
				border-radius: 4px;
				padding: 0.1rem 0.35rem;
			}
		</style>
	</head>
	<body>
		<div class="kutu">
			<h1>Panel açılamadı</h1>
			<pre id="hata">Bilinmeyen bir hata oluştu.</pre>
			<ol>
				<li>Menüden <strong>Görünüm → Yenile</strong> ile yeniden deneyin.</li>
				<li>
					Uygulamayı kapatıp terminalde <code>npm run yazi</code> çalıştırın;
					asıl hata orada ayrıntısıyla görünür.
				</li>
				<li>
					Bağımlılıklar eksikse <code>npm install</code> çalıştırın.
				</li>
			</ol>
		</div>
		<script>
			const gelen = decodeURIComponent(location.hash.slice(1));
			if (gelen) document.getElementById('hata').textContent = gelen;
		</script>
	</body>
</html>
